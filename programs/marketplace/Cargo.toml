[package]
name = "marketplace"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "marketplace"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build" , "anchor-spl/idl-build"]
custom-heap = []
anchor-debug = []


[dependencies]
anchor-lang = { version = "0.31.1" , features = ["init-if-needed"]}
anchor-spl = "0.31.1"
mpl-core = { version = "0.11.2" , features = ["anchor"]}

[lints.rust]
unexpected_cfs = { level = "warn" , check-cfg = ['cfg(target_os , values("solana"))']}